<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="forgotpassword.css">
</head>
<body>

    <div class="centered-page">
        <div class="card auth-card" style="padding:32px">
            <a href="homepage.html" style="font-family:var(--font-display);font-weight:700;color:var(--secondary)">DreamHome</a>
            <h2 style="margin-top:20px">Set a New Password</h2>

            <form id="reset-form">
                <div class="field">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="At least 6 characters">
                </div>
                <div class="field">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" required placeholder="Re-enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Set New Password</button>
            </form>
            <p id="message" class="error-message"></p>
            <p class="auth-alt"><a href="login.html">Back to Login</a></p>
        </div>
    </div>

    <script type="module" src="reset-password.js"></script>
</body>
</html>
