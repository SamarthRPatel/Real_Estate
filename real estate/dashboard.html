<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="app-shell">
        <aside class="app-sidebar">
            <a href="homepage.html" class="logo">DreamHome</a>
            <button class="item active" data-view="overview"><i data-lucide="layout-dashboard"></i> Dashboard</button>
            <button class="item" data-view="saved"><i data-lucide="heart"></i> Saved Properties</button>
            <button class="item" data-view="listings"><i data-lucide="home"></i> My Listings</button>
            <button class="item" data-view="messages"><i data-lucide="mail"></i> Messages</button>
            <button class="item" data-view="profile"><i data-lucide="user"></i> Profile</button>
            <button class="item" id="logout-btn" style="margin-top:auto"><i data-lucide="log-out"></i> Logout</button>
        </aside>

        <main class="app-main">
            <p id="welcome-message" style="margin-bottom:20px"></p>

            <section data-view-panel="overview">
                <h1>Dashboard</h1>
                <div class="stat-row">
                    <div class="stat-card"><div class="num" id="stat-saved">—</div><div class="lbl">Saved properties</div></div>
                    <div class="stat-card"><div class="num" id="stat-listings">—</div><div class="lbl">My listings</div></div>
                    <div class="stat-card"><div class="num" id="stat-pending">—</div><div class="lbl">Pending approval</div></div>
                </div>
                <h2>My Recent Listings</h2>
                <div class="listing-grid" id="overview-listings"><p>Loading...</p></div>
            </section>

            <section data-view-panel="saved" hidden>
                <h1>Saved Properties</h1>
                <div class="listing-grid" id="saved-grid"><p>Loading...</p></div>
            </section>

            <section data-view-panel="listings" hidden>
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h1>My Listings</h1>
                    <a href="sell.html" class="btn btn-primary btn-sm">+ New Listing</a>
                </div>
                <div class="listing-grid" id="my-listings-grid"><p>Loading...</p></div>
            </section>

            <section data-view-panel="messages" hidden>
                <h1>Messages</h1>
                <p>Inquiries buyers have sent about your listings.</p>
                <div id="messages-list"><p>Loading...</p></div>
            </section>

            <section data-view-panel="profile" hidden>
                <h1>Profile</h1>
                <div class="card" style="max-width:420px; padding:24px">
                    <form id="profile-form">
                        <div class="field">
                            <label for="profile-first-name">First Name</label>
                            <input type="text" id="profile-first-name" required>
                        </div>
                        <div class="field">
                            <label for="profile-last-name">Last Name</label>
                            <input type="text" id="profile-last-name" required>
                        </div>
                        <div class="field">
                            <label for="profile-phone">Phone</label>
                            <input type="text" id="profile-phone">
                        </div>
                        <div class="field">
                            <label>Email</label>
                            <input type="text" id="profile-email" disabled>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <p id="profile-status" style="margin-top:10px"></p>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
