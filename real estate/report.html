<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | DreamHome</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="report.css">
</head>
<body>

    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="logo">DreamHome</div>
            <a href="Admi.html" class="item" style="text-decoration:none">Pending Approvals</a>
            <div class="item active">Reports</div>
        </aside>

        <main class="app-main">
            <h1>Property Sales &amp; User Reports</h1>

            <div class="stat-row">
                <div class="stat-card">
                    <div class="num" id="totalSales">—</div>
                    <div class="lbl">Properties sold/rented</div>
                </div>
            </div>

            <div class="card" style="padding:20px; margin-bottom:var(--space-lg)">
                <h3>User Signups (by day)</h3>
                <canvas id="userActivityChart"></canvas>
            </div>

            <div class="card" style="overflow-x:auto">
                <h3 style="padding:16px 16px 0">Property Sales Report</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Property</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Sold Date</th>
                        </tr>
                    </thead>
                    <tbody id="propertyTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { apiFetch, escapeHtml } from "./js/api.js";
        import { requireAuth } from "./auth-guard.js";

        await requireAuth({ roles: ["admin"] });

        async function loadReports() {
            const data = await apiFetch("admin/reports");

            document.getElementById("totalSales").innerText = data.total_sold;

            let tableContent = "";
            data.properties.forEach(property => {
                tableContent += `
                    <tr>
                        <td>${escapeHtml(property.title)}</td>
                        <td class="tabular">$${Number(property.price).toLocaleString()}</td>
                        <td><span class="pill ${property.sold ? "pill-sold" : "pill-available"}"><span class="pill-dot"></span>${property.sold ? "Sold" : "Available"}</span></td>
                        <td>${property.sold_date ? new Date(property.sold_date).toLocaleDateString() : "N/A"}</td>
                    </tr>
                `;
            });
            document.getElementById("propertyTable").innerHTML = tableContent;

            const ctx = document.getElementById("userActivityChart").getContext("2d");
            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: data.user_activity.map(item => item.login_date),
                    datasets: [{
                        label: "Users Signed Up",
                        data: data.user_activity.map(item => item.total_users),
                        backgroundColor: "#006AFF",
                        borderRadius: 4,
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        loadReports();
    </script>

</body>
</html>
