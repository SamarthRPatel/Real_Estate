<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <div class="centered-page">
        <div class="card calculator-container">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                <h2 style="margin:0">Mortgage Calculator</h2>
                <button class="btn btn-ghost btn-sm" onclick="window.history.back()">← Back</button>
            </div>

            <div class="field">
                <label for="loanAmount">Loan Amount ($)</label>
                <input type="number" id="loanAmount" placeholder="Enter loan amount">
            </div>

            <div class="field">
                <label for="interestRate">Interest Rate (%)</label>
                <input type="number" id="interestRate" placeholder="Enter annual interest rate">
            </div>

            <div class="field">
                <label for="loanTerm">Loan Term (Years)</label>
                <input type="number" id="loanTerm" placeholder="Enter loan term in years">
            </div>

            <button class="btn btn-primary btn-block" onclick="calculateMortgage()">Calculate</button>

            <h3 style="margin-top:20px">Monthly Payment: <span id="monthlyPayment" class="tabular">$0.00</span></h3>
        </div>
    </div>

    <script>
        function calculateMortgage() {
            let loanAmount = parseFloat(document.getElementById('loanAmount').value);
            let interestRate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
            let loanTerm = parseFloat(document.getElementById('loanTerm').value) * 12;

            if (isNaN(loanAmount) || isNaN(interestRate) || isNaN(loanTerm) || loanTerm <= 0) {
                document.getElementById('monthlyPayment').innerText = "Invalid input";
                return;
            }

            let monthlyPayment = (loanAmount * interestRate) / (1 - Math.pow(1 + interestRate, -loanTerm));
            document.getElementById('monthlyPayment').innerText = `$${monthlyPayment.toFixed(2)}`;
        }

        // Pre-fill from a property price if linked from property-details.html
        const params = new URLSearchParams(window.location.search);
        const price = params.get("price");
        if (price) document.getElementById("loanAmount").value = price;
    </script>
</body>
</html>
