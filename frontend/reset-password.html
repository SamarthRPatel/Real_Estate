<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="forgotpassword.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="centered-page">
        <div class="card auth-card">
            <a href="login.html" class="auth-back"><i data-lucide="arrow-left"></i> Back to login</a>
            <a href="homepage.html" class="auth-logo-static">DreamHome</a>
            <h2 class="auth-title">Set a New Password</h2>
            <p class="auth-subtitle">Choose a new password for your account.</p>

            <form id="reset-form">
                <div class="field field-icon">
                    <label for="new-password">New Password</label>
                    <i data-lucide="lock" class="field-glyph"></i>
                    <div class="password-wrapper">
                        <input type="password" id="new-password" required placeholder="At least 6 characters">
                        <span class="toggle-password" data-target="new-password" role="button" tabindex="0" aria-label="Show password">
                            <i data-lucide="eye"></i>
                        </span>
                    </div>
                </div>
                <div class="field field-icon">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <i data-lucide="lock" class="field-glyph"></i>
                    <div class="password-wrapper">
                        <input type="password" id="confirm-new-password" required placeholder="Re-enter password">
                        <span class="toggle-password" data-target="confirm-new-password" role="button" tabindex="0" aria-label="Show password">
                            <i data-lucide="eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Set New Password <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <p id="message" class="error-message"></p>
        </div>
    </div>

    <script type="module" src="reset-password.js"></script>
    <script>
        function togglePassword(fieldId, toggleEl) {
            const field = document.getElementById(fieldId);
            const isHidden = field.type === "password";
            field.type = isHidden ? "text" : "password";
            toggleEl.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            toggleEl.innerHTML = `<i data-lucide="${isHidden ? "eye-off" : "eye"}"></i>`;
            if (window.lucide) lucide.createIcons();
        }

        document.querySelectorAll(".toggle-password").forEach((toggle) => {
            const fieldId = toggle.dataset.target;
            toggle.addEventListener("click", () => togglePassword(fieldId, toggle));
            toggle.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePassword(fieldId, toggle); }
            });
        });

        if (window.lucide) lucide.createIcons();
    </script>

</body>
</html>
