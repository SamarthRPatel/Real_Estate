<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sold &amp; Rented | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="buy.css">
    <link rel="stylesheet" href="sold-rented.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="index.html">DreamHome</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="buy.html">Buy</a>
                <a href="rent.html">Rent</a>
                <a href="sell.html">Sell</a>
                <a href="sold-rented.html">Sold/Rented</a>
            </div>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
            </div>
            <button class="nav-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Recently Sold &amp; Rented</h1>
            <p>A look at properties that have already found a buyer or tenant.</p>
        </div>
    </header>

    <div class="container">
        <div class="filter-bar">
            <div class="field" style="flex:2">
                <input type="text" id="search-bar" placeholder="Search by location or keyword">
            </div>
            <div class="field">
                <select id="filter-type">
                    <option value="">Property Type</option>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="condo">Condo</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
        </div>

        <div class="property-list" id="property-list">
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div>&copy; 2026 DreamHome. All rights reserved.</div>
        </div>
    </footer>

    <script type="module" src="sold-rented.js"></script>
    <script type="module">
        import { initNavToggle, initIcons } from "./js/ui.js";
        initNavToggle();
        initIcons();
    </script>
</body>
</html>
