<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy a Home | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="buy.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="index.html">DreamHome</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="buy.html">Buy</a>
                <a href="rent.html">Rent</a>
                <a href="sell.html">Sell</a>
                <a href="sold-rented.html">Sold/Rented</a>
            </div>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
            </div>
            <button class="nav-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Buy Your Dream Home</h1>
            <p>Browse available properties for sale.</p>
        </div>
    </header>

    <div class="container">
        <div class="filter-bar">
            <div class="field" style="flex:2">
                <input type="text" id="search-bar" placeholder="Search by location or keyword">
            </div>
            <div class="field">
                <select id="filter-price">
                    <option value="">Price Range</option>
                    <option value="low">Below $300,000</option>
                    <option value="medium">$300,000 - $700,000</option>
                    <option value="high">Above $700,000</option>
                </select>
            </div>
            <div class="field">
                <select id="filter-type">
                    <option value="">Property Type</option>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="condo">Condo</option>
                </select>
            </div>
            <div class="field">
                <select id="filter-bedrooms">
                    <option value="">Any Beds</option>
                    <option value="1">1+ Beds</option>
                    <option value="2">2+ Beds</option>
                    <option value="3">3+ Beds</option>
                    <option value="4">4+ Beds</option>
                </select>
            </div>
            <div class="field">
                <select id="filter-bathrooms">
                    <option value="">Any Baths</option>
                    <option value="1">1+ Baths</option>
                    <option value="2">2+ Baths</option>
                    <option value="3">3+ Baths</option>
                </select>
            </div>
            <div class="field">
                <select id="sort-by">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
        </div>

        <div class="property-list" id="property-list">
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
        </div>

        <div class="pagination" id="pagination"></div>

        <div class="card subscription-container">
            <h2>Subscribe for Property Alerts</h2>
            <div style="display:flex; gap:10px; max-width:420px; margin:0 auto">
                <input type="email" id="subscriber-email" placeholder="Enter your email" style="flex:1; padding:11px 14px; border-radius:8px; border:1.5px solid var(--border)">
                <button class="btn btn-primary" onclick="subscribeUser()">Subscribe</button>
            </div>
            <p id="subscription-message" style="margin-top:10px"></p>
        </div>

        <div class="calculator-section">
            <a href="calculator.html" class="btn btn-ghost"><i data-lucide="calculator"></i> Mortgage Calculator</a>
        </div>

        <div class="map-container">
            <h3>Find Properties on Map</h3>
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.83947475812!2d-73.99343872224154!3d45.50883986219859!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc91a1f8c295f1d%3A0x9c5e64f4b1eaa84b!2sMontreal%2C%20QC!5e0!3m2!1sen!2sca!4v1708381770131!5m2!1sen!2sca" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div>&copy; 2026 DreamHome. All rights reserved.</div>
        </div>
    </footer>

    <script type="module" src="buy.js"></script>
    <script type="module" src="subscription.js"></script>
    <script type="module">
        import { initNavToggle, initIcons } from "./js/ui.js";
        initNavToggle();
        initIcons();
    </script>
</body>
</html>
