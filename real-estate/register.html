<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="register.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="register.js"></script>
</head>
<body>

    <div class="auth-split">
        <div class="auth-form-side">
            <div class="auth-card">
                <a href="homepage.html" class="auth-back"><i data-lucide="arrow-left"></i> Back</a>

                <h2 class="auth-title">Create an Account</h2>
                <p class="auth-subtitle">Join <strong>DreamHome</strong> to save favorites, list a property, or manage your listings.</p>

                <form onsubmit="registerUser(event)">
                    <div class="field field-icon">
                        <label for="first_name">First Name</label>
                        <i data-lucide="user" class="field-glyph"></i>
                        <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
                    </div>

                    <div class="field field-icon">
                        <label for="last_name">Last Name</label>
                        <i data-lucide="user" class="field-glyph"></i>
                        <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
                    </div>

                    <div class="field field-icon">
                        <label for="email">Email</label>
                        <i data-lucide="mail" class="field-glyph"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="field field-icon">
                        <label for="password">Password</label>
                        <i data-lucide="lock" class="field-glyph"></i>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                            <span class="toggle-password" data-target="password" role="button" tabindex="0" aria-label="Show password">
                                <i data-lucide="eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field field-icon">
                        <label for="confirm-password">Confirm Password</label>
                        <i data-lucide="lock" class="field-glyph"></i>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
                            <span class="toggle-password" data-target="confirm-password" role="button" tabindex="0" aria-label="Show password">
                                <i data-lucide="eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field field-icon">
                        <label for="phone">Phone Number</label>
                        <i data-lucide="phone" class="field-glyph"></i>
                        <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Sign Up <i data-lucide="arrow-right"></i>
                    </button>
                </form>

                <p class="auth-alt">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>

        <div class="auth-illustration auth-scene">
            <div class="auth-scene-copy">
                <span class="auth-eyebrow">Get started</span>
                <a href="homepage.html" class="auth-logo">DreamHome</a>
                <h2>Buy, rent, or <span class="auth-highlight">sell</span> — start here.</h2>
                <p>Create an account to save favorites, list a property, or manage your listings.</p>
            </div>

            <div class="scene" aria-hidden="true">
                <div class="scene-sun"></div>

                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>

                <span class="bird bird-1">^</span>
                <span class="bird bird-2">^</span>
                <span class="bird bird-3">^</span>

                <div class="scene-ground">
                    <div class="skyline">
                        <div class="building b1"></div>
                        <div class="building b2"></div>
                        <div class="building b3"></div>
                        <div class="building b4"></div>
                        <div class="building b5"></div>
                        <div class="building b6"></div>
                        <div class="building b7"></div>
                    </div>

                    <div class="tree tree-1"><span class="tree-canopy"></span><span class="tree-trunk"></span></div>
                    <div class="tree tree-2"><span class="tree-canopy"></span><span class="tree-trunk"></span></div>
                    <div class="tree tree-3"><span class="tree-canopy"></span><span class="tree-trunk"></span></div>

                    <div class="road">
                        <div class="road-line"></div>
                        <div class="car car-1"></div>
                        <div class="car car-2"></div>
                        <div class="car car-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, toggleEl) {
            const field = document.getElementById(fieldId);
            const isHidden = field.type === "password";
            field.type = isHidden ? "text" : "password";
            toggleEl.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            toggleEl.innerHTML = `<i data-lucide="${isHidden ? "eye-off" : "eye"}"></i>`;
            if (window.lucide) lucide.createIcons();
        }

        document.querySelectorAll(".toggle-password").forEach((toggle) => {
            const fieldId = toggle.dataset.target;
            toggle.addEventListener("click", () => togglePassword(fieldId, toggle));
            toggle.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePassword(fieldId, toggle); }
            });
        });

        if (window.lucide) lucide.createIcons();
    </script>

</body>
</html>
