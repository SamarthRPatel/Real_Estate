<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent a Property | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="buy.css">
    <link rel="stylesheet" href="rent.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="homepage.html">DreamHome</a>
            <div class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="buy.html">Buy</a>
                <a href="rent.html">Rent</a>
                <a href="sell.html">Sell</a>
                <a href="sold-rented.html">Sold/Rented</a>
            </div>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
            </div>
            <button class="nav-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>Rent a Property</h1>
            <p>Browse available rentals.</p>
        </div>
    </header>

    <div class="container">
        <div class="filter-bar">
            <div class="field" style="flex:2">
                <input type="text" id="search-bar" placeholder="Search by location or keyword">
            </div>
            <div class="field">
                <select id="filter-type">
                    <option value="">Property Type</option>
                    <option value="apartment">Apartment</option>
                    <option value="house">House</option>
                    <option value="condo">Condo</option>
                </select>
            </div>
            <div class="field">
                <select id="filter-bedrooms">
                    <option value="">Any Beds</option>
                    <option value="1">1+ Beds</option>
                    <option value="2">2+ Beds</option>
                    <option value="3">3+ Beds</option>
                    <option value="4">4+ Beds</option>
                </select>
            </div>
            <div class="field">
                <select id="sort-by">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
        </div>

        <div class="property-list" id="property-list">
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
            <div class="skeleton" style="height:260px"></div>
        </div>

        <div class="pagination" id="pagination"></div>

        <div class="map-container">
            <h3>Find Us Here</h3>
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.83947475812!2d-73.99343872224154!3d45.50883986219859!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc91a1f8c295f1d%3A0x9c5e64f4b1eaa84b!2sMontreal%2C%20QC!5e0!3m2!1sen!2sca!4v1708381770131!5m2!1sen!2sca" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div>&copy; 2026 DreamHome. All rights reserved.</div>
        </div>
    </footer>

    <script type="module" src="rent.js"></script>
    <script type="module">
        import { initNavToggle, initIcons } from "./js/ui.js";
        initNavToggle();
        initIcons();
    </script>
</body>
</html>
