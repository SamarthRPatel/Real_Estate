<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="forgotpassword.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="centered-page">
        <div class="card auth-card">
            <a href="login.html" class="auth-back"><i data-lucide="arrow-left"></i> Back to login</a>
            <a href="homepage.html" class="auth-logo-static">DreamHome</a>
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter the email on your account and we'll send you a reset link.</p>

            <form id="forgotPasswordForm">
                <div class="field field-icon">
                    <label for="reset-email">Email</label>
                    <i data-lucide="mail" class="field-glyph"></i>
                    <input type="email" id="reset-email" required placeholder="Enter your email">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Send Reset Link <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <p id="message" class="error-message"></p>
        </div>
    </div>

    <script type="module">
        import { apiFetch } from "./js/api.js";

        document.getElementById("forgotPasswordForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const message = document.getElementById("message");
            const email = document.getElementById("reset-email").value;

            try {
                await apiFetch("auth/forgot-password", { method: "POST", body: { email } });
                message.style.color = "var(--accent)";
                message.textContent = "If that email exists, a reset link has been sent. Check your inbox.";
            } catch (error) {
                message.style.color = "var(--danger)";
                message.textContent = "Something went wrong: " + error.message;
            }
        });
    </script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>

</body>
</html>
