<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DreamHome</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="contactpage.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="homepage.html">DreamHome</a>
            <div class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="buy.html">Buy</a>
                <a href="rent.html">Rent</a>
                <a href="sell.html">Sell</a>
                <a href="sold-rented.html">Sold/Rented</a>
            </div>
        </div>
    </nav>

    <div class="container contactpage-wrap">
        <div class="card contact-container">
            <h2>Contact Us</h2>
            <p>Have questions? Get in touch with us!</p>

            <form id="contact-form">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="field">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Message</button>
                <p id="contact-status" style="margin-top:10px"></p>
            </form>

            <div class="contact-info">
                <h3>Our Office</h3>
                <p>1350 Du Fort Street, Montreal, QC</p>
                <p>Email: sam@realestate.com</p>
                <p>Phone: +1 819-513-0853</p>
            </div>

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.83947475812!2d-73.99343872224154!3d45.50883986219859!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc91a1f8c295f1d%3A0x9c5e64f4b1eaa84b!2sMontreal%2C%20QC!5e0!3m2!1sen!2sca!4v1708381770131!5m2!1sen!2sca"
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container"><div>&copy; 2026 DreamHome. All rights reserved.</div></div>
    </footer>

    <script type="module">
        import { apiFetch } from "./js/api.js";
        import { initIcons } from "./js/ui.js";
        initIcons();

        document.getElementById("contact-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const status = document.getElementById("contact-status");
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            try {
                await apiFetch("contact", { method: "POST", body: { name, email, message } });
                status.textContent = "Message sent — we'll get back to you soon.";
                status.style.color = "var(--accent)";
                document.getElementById("contact-form").reset();
            } catch (error) {
                status.textContent = "Failed to send message: " + error.message;
                status.style.color = "var(--danger)";
            }
        });
    </script>
</body>
</html>
